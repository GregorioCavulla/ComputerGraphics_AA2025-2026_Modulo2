<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Graphics — Modulo 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #071116;
      --panel: rgba(4, 18, 24, 0.88);
      --panel-strong: rgba(8, 24, 30, 0.96);
      --card-border: rgba(104, 242, 208, 0.26);
      --line: #267a70;
      --ink: #dcfff6;
      --muted: #7db5a9;
      --aqua: #68f2d0;
      --yellow: #fff06a;
      --hot: #ff4978;
      --shadow: rgba(0,0,0,.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Trebuchet MS", "Aptos", sans-serif;
      background: radial-gradient(circle at 50% 15%, #18343b 0, #071116 48%, #03080b 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #canvas-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.82;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
      padding: 2.5rem 1.5rem;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-family: "Courier New", monospace;
      font-size: 0.8rem;
      color: var(--aqua);
      background: rgba(104, 242, 208, 0.08);
      border: 1px solid rgba(104, 242, 208, 0.2);
      padding: 0.38rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2.15rem, 5vw, 3.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.7rem;
      color: var(--ink);
      text-shadow: 0 0 18px rgba(104, 242, 208, 0.18);
    }

    .author {
      font-size: 1.05rem;
      color: var(--muted);
      margin-bottom: 3rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.2rem;
      margin-bottom: 2.5rem;
    }

    @media (max-width: 580px) {
      .actions-grid {
        grid-template-columns: 1fr;
      }
    }

    .action-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: linear-gradient(180deg, rgba(5, 22, 28, 0.72), rgba(4, 13, 17, 0.92));
      border: 1px solid var(--card-border);
      border-radius: 18px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-decoration: none;
      color: var(--ink);
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.2);
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }

    .action-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, var(--glow-color, rgba(104,242,208,0.14)), transparent 70%);
      opacity: 0;
      transition: opacity .25s ease;
    }

    .action-card:hover,
    .action-card:focus-visible {
      transform: translateY(-4px);
      border-color: var(--hover-border, rgba(104, 242, 208, 0.5));
      box-shadow: 0 18px 70px rgba(0,0,0,.32);
      outline: none;
    }

    .action-card:hover::before,
    .action-card:focus-visible::before {
      opacity: 1;
    }

    .action-card.project {
      --hover-border: rgba(104, 242, 208, 0.56);
      --glow-color: rgba(104, 242, 208, 0.16);
    }

    .action-card.doc {
      --hover-border: rgba(255, 240, 106, 0.52);
      --glow-color: rgba(255, 240, 106, 0.12);
    }

    .icon-box {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.15rem;
      background: rgba(2, 10, 14, 0.72);
      border: 1px solid rgba(104, 242, 208, 0.18);
      transition: transform .25s ease;
      position: relative;
      z-index: 1;
    }

    .action-card:hover .icon-box,
    .action-card:focus-visible .icon-box {
      transform: scale(1.08);
    }

    .project .icon-box { color: var(--aqua); }
    .doc .icon-box { color: var(--yellow); }

    .card-title {
      position: relative;
      z-index: 1;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .card-desc {
      position: relative;
      z-index: 1;
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: "Courier New", monospace;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .repo-link:hover,
    .repo-link:focus-visible {
      color: var(--aqua);
      outline: none;
    }

    .credits {
      position: fixed;
      right: 18px;
      bottom: 14px;
      max-width: min(80vw, 760px);
      color: rgba(125, 181, 169, 0.9);
      font-size: 0.62rem;
      line-height: 1.4;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: right;
      z-index: 2;
      pointer-events: auto;
    }

    .credits strong {
      color: var(--aqua);
      font-weight: 700;
    }

    .credits a {
      color: var(--yellow);
      text-decoration: none;
    }

    .credits a:hover,
    .credits a:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    @media (max-width: 640px) {
      .credits {
        right: 12px;
        bottom: 10px;
        max-width: calc(100vw - 24px);
        font-size: 0.56rem;
        letter-spacing: 0.04em;
      }
    }
  </style>

  <script>
    // Semplice sfondo a nodi/costellazione interattivo col mouse
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let w, h, nodes = [];
    const mouse = { x: null, y: null };

    function init() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      nodes = [];
      const count = Math.floor((w * h) / 22000);
      for (let i = 0; i < count; i++) {
        nodes.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          radius: Math.random() * 1.5 + 1
        });
      }
    }

    function render() {
      ctx.clearRect(0, 0, w, h);

      for (let i = 0; i < nodes.length; i++) {
        let n = nodes[i];
        n.x += n.vx;
        n.y += n.vy;

        if (n.x < 0 || n.x > w) n.vx *= -1;
        if (n.y < 0 || n.y > h) n.vy *= -1;

        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
        ctx.fill();

        for (let j = i + 1; j < nodes.length; j++) {
          let n2 = nodes[j];
          let dist = Math.hypot(n.x - n2.x, n.y - n2.y);
          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(n.x, n.y);
            ctx.lineTo(n2.x, n2.y);
            ctx.strokeStyle = `rgba(56, 189, 248, ${0.12 * (1 - dist / 120)})`;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(render);
    }

    window.addEventListener('resize', init);
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    init();
    render();
  </script>

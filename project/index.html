<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porygon-Z | Benchmark grafico</title>
<style>
    :root { --ink: #dcfff6; --muted: #7db5a9; --line: #267a70; --panel: rgba(4, 18, 24, 0.88); --hot: #ff4978; --aqua: #68f2d0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: radial-gradient(circle at 50% 15%, #18343b 0, #071116 48%, #03080b 100%); color: var(--ink); font-family: "Trebuchet MS", "Aptos", sans-serif; }
    body > canvas { display: block; }
    #start-overlay { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
    #start-overlay[hidden] { display: none; }
    .start-card { margin-top: 58vh; width: min(440px, calc(100vw - 36px)); padding: 18px; border: 1px solid rgba(104, 242, 208, .5); background: linear-gradient(180deg, rgba(5, 22, 28, .72), rgba(4, 13, 17, .9)); box-shadow: 0 18px 70px rgba(0, 0, 0, .38); backdrop-filter: blur(10px); pointer-events: auto; }
    h1 { margin: 0 0 8px; color: var(--aqua); font-size: 1.15rem; letter-spacing: .08em; text-transform: uppercase; }
    .start-card p { margin: 0 0 14px; color: var(--muted); line-height: 1.45; font-size: .9rem; }
    label { display: block; margin: 0 0 12px; color: var(--muted); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }
    .checkline { display: flex; align-items: center; gap: 8px; }
    .checkline input { accent-color: var(--aqua); }
    select { width: 100%; margin-top: 6px; border: 1px solid rgba(104, 242, 208, .38); background: rgba(2, 10, 14, .9); color: var(--ink); padding: 10px; font: inherit; }
    button { width: 100%; border: 0; color: #041014; background: linear-gradient(90deg, var(--aqua), #fff06a 56%, var(--hot)); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 13px 16px; cursor: pointer; }
    button:disabled { cursor: not-allowed; filter: grayscale(1); }
    #data-panel { position: fixed; top: 16px; right: 16px; width: min(310px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line); padding: 12px; pointer-events: none; box-shadow: 0 16px 60px rgba(0,0,0,.38); }
    .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .metric { min-height: 58px; border: 1px solid rgba(104, 242, 208, .2); background: rgba(2, 10, 14, .52); padding: 8px; }
    .metric span { display: block; color: var(--muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; }
    .metric strong { display: block; margin-top: 4px; color: var(--ink); font-size: 1.05rem; overflow-wrap: anywhere; }
    #sparkline { width: 100%; height: 74px; margin: 12px 0; border: 1px solid rgba(104, 242, 208, .22); }
    .log { color: var(--muted); font-size: .72rem; line-height: 1.45; max-height: 130px; overflow: hidden; }
    .results { margin-top: 10px; color: #fff06a; font-size: .72rem; line-height: 1.45; }
    #results-controls { position: fixed; left: 16px; bottom: 16px; width: min(360px, calc(100vw - 32px)); padding: 14px; background: var(--panel); border: 1px solid var(--line); pointer-events: auto; box-shadow: 0 16px 60px rgba(0,0,0,.38); }
    #results-controls[hidden] { display: none; }
    #results-controls button { margin-top: 8px; }
    @media (max-width: 760px) { #data-panel { left: 12px; right: 12px; top: 12px; width: auto; } .start-card { margin-top: 50vh; } }
</style>
</head>
<body>
<div id="start-overlay" hidden>
    <section class="start-card">
        <h1>Porygon-Z Benchmark</h1>
        <p data-message>Benchmark misto: stesso sciame Pokemon prima naive, poi InstancedMesh.</p>
        <button type="button" data-start>Avvia benchmark</button>
    </section>
</div>
<div id="data-panel">
    <div class="metric-grid">
        <div class="metric"><span>Fase</span><strong data-field="phase">Avvio</strong></div>
        <div class="metric"><span>FPS</span><strong data-field="fps">0.0</strong></div>
        <div class="metric"><span>ms/frame</span><strong data-field="ms">0.0</strong></div>
        <div class="metric"><span>Draw call</span><strong data-field="calls">0</strong></div>
        <div class="metric"><span>Triangoli</span><strong data-field="triangles">0</strong></div>
        <div class="metric"><span>Istanze</span><strong data-field="count">0</strong></div>
    </div>
    <canvas id="sparkline" width="320" height="74"></canvas>
</div>
<div id="results-controls" hidden>
    <label>Visualizzazione finale
        <select data-final-mode>
            <option value="full">Full: ombre, riflessi, luce orbitante</option>
            <option value="simple">Simple: luce stabile, materiali leggeri</option>
        </select>
    </label>
    <button type="button" data-run-full>Esegui test full</button>
</div>
<script type="importmap">
{
    "imports": {
        "three": "./lib/three.module.js",
        "three/addons/": "./lib/jsm/"
    }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
